<!doctype html><html lang="vi"><meta charset="utf-8"><title>2.2 · WHERE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101024;color:#faf6ff;font:22px/1.4 "Segoe UI",sans-serif}
main{padding:24px}pre{min-height:82px;white-space:pre-wrap;margin:0;color:#ffb1db;font:20px/1.4 Consolas,monospace}
table{width:100%;border-spacing:0 4px;table-layout:fixed}col:nth-child(2){width:33%}th,td{text-align:left;padding:6px;line-height:1.25}th{color:#b8bbd7;font-size:18px;height:44px}td{background:#222138}td:first-child{font-family:Consolas,monospace}
.kept td{background:#173038}.tested{outline:2px solid #6de7d9;outline-offset:-3px}.alias{color:#85efda;border-top:2px solid}.old{display:block;font:13px Consolas,monospace;color:#d0c6d9}
</style><main><pre></pre><table><colgroup><col><col><col><col></colgroup><thead></thead><tbody></tbody></table></main>
<script>
const cols=['MaNV','HoTen','MaPB','TrangThai'];
let source,filtered,selected,roster,passed;
window.prepare = data => {
  if (data.id !== '2-2-where') throw Error('Ví dụ dùng unit 2-2-where. Tạo scene riêng cho bài khác.');
  [source,filtered,selected]=data.steps;
  roster=source.rows.map(row=>cols.map(c=>row[source.columns.indexOf(c)]));
  passed=new Set(filtered.rows.map(row=>row[filtered.columns.indexOf('MaNV')]));
  return {width:720,height:370,scenes:[
    {positions:10,leadMs:800,holdMs:2000},{positions:10,leadMs:800,holdMs:2000}
  ]};
};
window.draw = (scene,p) => {
  const selecting=scene===1;
  document.querySelector('pre').textContent=selecting ? selected.focus : (p===0 ? source.focus : filtered.focus);
  const headers=document.querySelector('thead'),body=document.querySelector('tbody');
  headers.replaceChildren();body.replaceChildren();
  const head=headers.insertRow();
  cols.forEach((name,i)=>{
    const th=document.createElement('th');th.textContent=name;
    if(selecting && p>i/cols.length) {
      th.classList.add('alias');
      th.textContent=selected.columns[i];
      if(p<1){
        const old=document.createElement('span');old.className='old';old.textContent=name+' ↓';th.prepend(old);
      }
    }
    head.append(th);
  });
  const rows=selecting ? selected.rows : roster;
  rows.forEach((values,i)=>{
    const tr=body.insertRow();
    const keep=passed.has(values[0]);
    const visited=!selecting && p>i/roster.length;
    if(visited && keep) tr.classList.add('kept');
    if(visited && !keep){ tr.style.opacity=String(1-.68*p);tr.style.textDecoration='line-through'; }
    values.forEach((v,j)=>{
      const cell=tr.insertCell();cell.textContent=v??'NULL';
      if(visited && keep && cols[j]==='MaPB')cell.classList.add('tested');
      if(selecting && p>j/cols.length)cell.style.borderLeft='2px solid #57998d';
    });
  });
};
</script>
