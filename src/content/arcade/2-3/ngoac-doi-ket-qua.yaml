prompt: >-
  Từ bảng NhanSu, lấy mã và họ tên của những người thuộc phòng KD hoặc phòng IT, và đang có trạng thái “Đang làm”. Điều kiện trạng thái áp dụng cho cả hai phòng.
columns: [ MaNV, HoTen ]
ordered: false
tables:
  NhanSu:
    MaNV: varchar(10) NOT NULL
    HoTen: nvarchar(100) NOT NULL
    MaPB: varchar(10) NOT NULL
    TrangThai: nvarchar(20) NOT NULL
answer: "SELECT MaNV, HoTen FROM NhanSu WHERE (MaPB = 'KD' OR MaPB = 'IT') AND TrangThai = N'Đang làm'"
