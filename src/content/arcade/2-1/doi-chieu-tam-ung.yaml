title: Đối chiếu khoản tạm ứng
difficulty: vua
lessons: [ 2-1-chon-cot-dat-ten-cot ]
prompt: >-
  Kế toán đối chiếu các khoản tạm ứng đang lưu trong bảng TamUng. Cột thứ nhất là mã tạm ứng, tiếp theo là ngày tiền được chi ra, rồi số tiền đã được duyệt, và cuối cùng là mã người nhận. Lấy mọi dòng, kể cả khoản chưa được duyệt.
columns: [ Mã tạm ứng, Ngày chi, Số tiền duyệt, Mã người nhận ]
ordered: false
tables:
  TamUng:
    MaTU: varchar(10) NOT NULL
    MaNV: varchar(10) NOT NULL
    NgayDeNghi: date NOT NULL
    NgayDuyet: date NULL
    NgayChi: date NULL
    SoTienDeNghi: decimal(12,0) NOT NULL
    SoTienDuyet: decimal(12,0) NULL
    LyDo: nvarchar(100) NULL
answer: SELECT MaTU, NgayChi, SoTienDuyet, MaNV FROM TamUng
