title: Bảng kê công tác phí
difficulty: de
lessons: [ 2-1-chon-cot-dat-ten-cot ]
prompt: >-
  Kế toán cần bảng kê từ bảng CongTacPhi, ba cột theo thứ tự: mã nhân viên, nơi đến, số tiền. Lấy mọi dòng đang lưu, kể cả dòng số tiền bằng 0 và các dòng có nội dung giống nhau.
columns: [ MaNV, NoiDen, SoTien ]
ordered: false
tables:
  CongTacPhi:
    MaCT: varchar(10) NOT NULL
    MaNV: varchar(10) NOT NULL
    NgayDi: date NOT NULL
    NoiDen: nvarchar(50) NOT NULL
    SoTien: decimal(12,0) NOT NULL
    GhiChu: nvarchar(200) NULL
answer: SELECT MaNV, NoiDen, SoTien FROM CongTacPhi
