prompt: >-
  Biểu kiểm kê ghi tên tài sản ở cột đầu và mã tài sản ở cột thứ hai. Từ bảng TaiSan, lấy hai cột theo đúng thứ tự đó cho mọi tài sản đang lưu.
columns: [ TenTS, MaTS ]
ordered: false
tables:
