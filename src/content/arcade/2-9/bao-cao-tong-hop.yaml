id: bao-cao-tong-hop
chapter: '2-9'
order: 6
title: Báo cáo hợp đồng
difficulty: kho
lessons: [ 2-5-null-o-trong, 2-8-ham-ngay-tham-nien, 2-9-case-when-ham-if ]
prompt: >-
  Tại mốc cố định 21/10/2026, nhân sự cần báo cáo các hợp đồng đang lưu của phòng KD hoặc IT. Từ bảng HopDong, lấy mã hợp đồng và một cột ghi chú: chưa có ngày kết thúc thì ghi Không thời hạn; ngày kết thúc trước mốc thì ghi Đã hết; ngày kết thúc từ mốc đến hết 30 ngày sau mốc thì ghi Sắp hết; còn lại ghi Còn hạn. Xếp mã tăng dần.
columns: [ MaHD, Ghi chú ]
ordered: true
tables:
  HopDong:
    MaHD: varchar(20) NOT NULL
    MaPB: varchar(10) NOT NULL
    NgayKetThuc: date NULL
answer: "SELECT MaHD, CASE WHEN NgayKetThuc IS NULL THEN N'Không thời hạn' WHEN NgayKetThuc <= DATEADD(day, -1, CAST('20261021' AS date)) THEN N'Đã hết' WHEN NgayKetThuc <= DATEADD(day, 30, CAST('20261021' AS date)) THEN N'Sắp hết' ELSE N'Còn hạn' END AS [Ghi chú] FROM HopDong WHERE MaPB IN ('KD', 'IT') ORDER BY MaHD ASC"
tests:
  - id: 1
    visible: true
    rows:
      HopDong:
        - [ "HD01", "KD", null ]
        - [ "HD02", "IT", "2026-05-01" ]
        - [ "HD03", "KD", "2026-11-01" ]
    expected: [ [ "HD01", "Không thời hạn" ], [ "HD02", "Đã hết" ], [ "HD03", "Sắp hết" ] ]
  - id: 2
    visible: true
    rows:
