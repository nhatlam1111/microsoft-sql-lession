id: nhan-tham-nien
chapter: '2-9'
order: 5
title: Nhóm thâm niên tại mốc
difficulty: kho
lessons: [ 2-4-sap-xep-va-top, 2-8-ham-ngay-tham-nien, 2-9-case-when-ham-if ]
prompt: >-
  Tại mốc cố định 21/10/2026, chia người trong bảng NhanSu theo ngày kỷ niệm: đã đủ 3 năm thì ghi “Từ 3 năm”, đã đủ 1 năm thì ghi “Từ 1 năm”, còn lại ghi “Dưới 1 năm”. Đủ năm tính cả đúng ngày kỷ niệm. Lấy mã nhân viên và nhóm, xếp mã tăng dần.
columns: [ MaNV, Nhóm ]
ordered: true
tables:
  NhanSu:
    MaNV: varchar(10) NOT NULL
    NgayVaoLam: date NOT NULL
answer: "SELECT MaNV, CASE WHEN DATEADD(year, 3, NgayVaoLam) <= '20261021' THEN N'Từ 3 năm' WHEN DATEADD(year, 1, NgayVaoLam) <= '20261021' THEN N'Từ 1 năm' ELSE N'Dưới 1 năm' END AS [Nhóm] FROM NhanSu ORDER BY MaNV ASC"
tests:
  - id: 1
    visible: true
    rows:
      NhanSu:
        - [ "NV401", "2020-05-05" ]
        - [ "NV402", "2024-05-05" ]
        - [ "NV403", "2026-03-03" ]
    expected: [ [ "NV401", "Từ 3 năm" ], [ "NV402", "Từ 1 năm" ], [ "NV403", "Dưới 1 năm" ] ]
