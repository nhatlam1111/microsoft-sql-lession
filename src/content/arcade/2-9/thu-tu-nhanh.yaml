id: thu-tu-nhanh
chapter: '2-9'
order: 3
title: Xếp hạng nhà cung cấp
difficulty: vua
lessons: [ 2-5-null-o-trong, 2-8-ham-ngay-tham-nien, 2-9-case-when-ham-if ]
prompt: >-
  Từ bảng NhaCungCap, lấy mã và hạng cho mọi dòng: có từ 20 đơn trở lên là Lâu năm; nếu không thì có từ 5 đơn trở lên là Quen; còn lại là Mới. Số đơn luôn có giá trị.
columns: [ MaNCC, Hạng ]
ordered: false
tables:
  NhaCungCap:
    MaNCC: varchar(10) NOT NULL
    SoDon: decimal(6,0) NOT NULL
answer: "SELECT MaNCC, CASE WHEN SoDon >= 20 THEN N'Lâu năm' WHEN SoDon >= 5 THEN N'Quen' ELSE N'Mới' END AS [Hạng] FROM NhaCungCap"
tests:
  - id: 1
    visible: true
    rows:
      NhaCungCap:
        - [ "C01", 30 ]
        - [ "C02", 7 ]
        - [ "C03", 2 ]
    expected: [ [ "C01", "Lâu năm" ], [ "C02", "Quen" ], [ "C03", "Mới" ] ]
  - id: 2
    visible: true
    rows:
      NhaCungCap:
        - [ "C05", 12 ]
        - [ "C06", 45 ]
        - [ "C07", 1 ]
    expected: [ [ "C05", "Quen" ], [ "C06", "Lâu năm" ], [ "C07", "Mới" ] ]
  - id: 3
    catches: "SELECT MaNCC, CASE WHEN SoDon >= 21 THEN N'Lâu năm' WHEN SoDon >= 5 THEN N'Quen' ELSE N'Mới' END FROM NhaCungCap"
    rows:
      NhaCungCap:
        - [ "C11", 20 ]
        - [ "C12", 3 ]
    expected: [ [ "C11", "Lâu năm" ], [ "C12", "Mới" ] ]
  - id: 4
    catches: "SELECT MaNCC, CASE WHEN SoDon >= 20 THEN N'Lâu năm' WHEN SoDon >= 6 THEN N'Quen' ELSE N'Mới' END FROM NhaCungCap"
    rows:
      NhaCungCap:
        - [ "C21", 5 ]
        - [ "C22", 25 ]
    expected: [ [ "C21", "Quen" ], [ "C22", "Lâu năm" ] ]
  - id: 5
    catches: "SELECT MaNCC, CASE WHEN SoDon >= 20 THEN N'Lâu năm' WHEN SoDon BETWEEN 5 AND 15 THEN N'Quen' ELSE N'Mới' END FROM NhaCungCap"
    rows:
      NhaCungCap:
        - [ "C31", 18 ]
