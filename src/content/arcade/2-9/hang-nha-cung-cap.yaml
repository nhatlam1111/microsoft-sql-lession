id: hang-nha-cung-cap
chapter: '2-9'
order: 3
title: Nhóm nhà cung cấp
difficulty: vua
lessons: [ 2-9-case-when-ham-if ]
prompt: >-
  Từ bảng NhaCungCap, lấy mã và nhóm cho mọi dòng: có từ 20 đơn trở lên ghi “Thân thiết”; nếu không thì có từ 5 đơn trở lên ghi “Quen”; còn lại ghi “Mới”. Số đơn luôn có giá trị.
columns: [ MaNCC, Nhóm ]
ordered: false
tables:
  NhaCungCap:
    MaNCC: varchar(10) NOT NULL
    SoDon: decimal(6,0) NOT NULL
answer: "SELECT MaNCC, CASE WHEN SoDon >= 20 THEN N'Thân thiết' WHEN SoDon >= 5 THEN N'Quen' ELSE N'Mới' END AS [Nhóm] FROM NhaCungCap"
tests:
  - id: 1
    visible: true
    rows:
      NhaCungCap:
        - [ "C01", 30 ]
        - [ "C02", 7 ]
        - [ "C03", 2 ]
    expected: [ [ "C01", "Thân thiết" ], [ "C02", "Quen" ], [ "C03", "Mới" ] ]
  - id: 2
    visible: true
    rows:
      NhaCungCap:
        - [ "C05", 12 ]
