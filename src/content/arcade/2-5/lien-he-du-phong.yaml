id: lien-he-du-phong
chapter: '2-5'
order: 5
title: Số liên hệ dự phòng
difficulty: kho
lessons: [ 2-5-null-o-trong ]
prompt: >-
  Lễ tân cần số liên hệ của các nhà cung cấp đang hợp tác (TrangThai là Đang hợp tác). Từ bảng NhaCungCap, lấy mã và một cột liên hệ: ưu tiên DiDong, không có thì dùng CoDinh, cả hai đều không có thì ghi (chưa có số). Xếp mã tăng dần.
columns: [ MaNCC, Liên hệ ]
ordered: true
tables:
  NhaCungCap:
    MaNCC: varchar(10) NOT NULL
    TenNCC: nvarchar(100) NOT NULL
    DiDong: varchar(20) NULL
    CoDinh: varchar(20) NULL
    TrangThai: nvarchar(20) NOT NULL
answer: "SELECT MaNCC, COALESCE(DiDong, CoDinh, N'(chưa có số)') AS [Liên hệ] FROM NhaCungCap WHERE TrangThai = N'Đang hợp tác' ORDER BY MaNCC ASC"
