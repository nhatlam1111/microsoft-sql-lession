id: danh-muc-co-loc
chapter: '2-6'
order: 4
title: Danh mục địa điểm đã đi
difficulty: kho
lessons: [ 2-6-distinct-bo-dong-trung ]
prompt: >-
  Kế toán cần danh mục nơi đến của các chuyến công tác đã thanh toán (TrangThai là Đã thanh toán) có ngày đi từ 01/07/2026 trở đi, gồm cả ngày đó. Từ bảng CongTacPhi, lấy nơi đến và mã phòng, mỗi cặp một dòng, xếp nơi đến tăng dần, cùng nơi đến thì mã phòng tăng dần.
columns: [ NoiDen, MaPB ]
ordered: true
tables:
  CongTacPhi:
    MaCT: varchar(10) NOT NULL
    NoiDen: nvarchar(50) NOT NULL
    MaPB: varchar(10) NOT NULL
    NgayDi: date NOT NULL
    TrangThai: nvarchar(20) NOT NULL
answer: "SELECT DISTINCT NoiDen, MaPB FROM CongTacPhi WHERE TrangThai = N'Đã thanh toán' AND NgayDi >= '20260701' ORDER BY NoiDen ASC, MaPB ASC"
