    MaCT: varchar(10) NOT NULL
    MaNV: varchar(10) NOT NULL
    NoiDen: nvarchar(50) NOT NULL
    SoTienDuKien: decimal(12,0) NOT NULL
    SoTienThucChi: decimal(12,0) NOT NULL
answer: "SELECT NoiDen, SoTienThucChi, MaNV FROM CongTacPhi WHERE SoTienThucChi >= 2000000"
