prompt: >-
  Thử việc kéo dài đúng hai tháng tính từ ngày bắt đầu. Từ bảng ThuViec, lấy mã nhân viên và ngày sau ngày bắt đầu hai tháng cho mọi dòng.
columns: [ MaNV, Ngày hết thử việc ]
ordered: false
tables:
