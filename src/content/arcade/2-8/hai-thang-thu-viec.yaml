lessons: [ 2-8-ham-ngay-tham-nien ]
prompt: >-
  Ngày hết thử việc được ghi là ngày sau ngày bắt đầu đúng hai tháng, ví dụ bắt đầu 10/03/2026 thì ghi 10/05/2026. Từ bảng ThuViec, lấy mã nhân viên và ngày hết thử việc cho mọi dòng.
columns: [ MaNV, Ngày hết thử việc ]
ordered: false
tables:
  ThuViec:
    MaNV: varchar(10) NOT NULL
    NgayBatDau: date NOT NULL
answer: "SELECT MaNV, DATEADD(month, 2, NgayBatDau) AS [Ngày hết thử việc] FROM ThuViec"
