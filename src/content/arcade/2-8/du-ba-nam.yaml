    NgayVaoLam: date NOT NULL
answer: "SELECT MaNV, NgayVaoLam FROM NhanSu WHERE DATEADD(year, 3, NgayVaoLam) <= '20261021' ORDER BY NgayVaoLam ASC, MaNV ASC"
