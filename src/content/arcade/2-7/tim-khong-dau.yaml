    MaKM: varchar(10) NOT NULL
    HoTen: nvarchar(100) NOT NULL
answer: "SELECT MaKM, HoTen FROM KhachMoi WHERE HoTen COLLATE Latin1_General_CI_AI LIKE N'ngo%' ORDER BY MaKM ASC"
