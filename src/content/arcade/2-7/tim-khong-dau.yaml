prompt: >-
  Lễ tân chỉ gõ được không dấu. Từ bảng KhachMoi, lấy mã và họ tên của những người có họ tên bắt đầu bằng ngo, không phân biệt dấu và hoa thường, ví dụ Ngô hay Ngọc đều được tính. Xếp mã tăng dần.
columns: [ MaKM, HoTen ]
ordered: true
tables:
