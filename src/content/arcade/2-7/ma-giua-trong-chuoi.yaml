id: ma-giua-trong-chuoi
chapter: '2-7'
order: 5
title: Mã phòng trong mã hồ sơ
difficulty: kho
lessons: [ 2-3-and-or-in-between-like, 2-7-ham-chuoi-tieng-viet ]
prompt: >-
  Mã hồ sơ có dạng HS, hai chữ số năm, mã phòng hai ký tự rồi số thứ tự, như HS26KD014. Từ bảng HoSo, lấy mã hồ sơ, mã phòng lấy từ vị trí 5 và 6 của mã hồ sơ, và số ký tự của tiêu đề hồ sơ, chỉ với những hồ sơ có mã phòng đó là KD.
columns: [ MaHS, Mã phòng, Số ký tự tiêu đề ]
ordered: false
tables:
  HoSo:
    MaHS: varchar(20) NOT NULL
    TieuDe: nvarchar(200) NOT NULL
answer: "SELECT MaHS, SUBSTRING(MaHS, 5, 2) AS [Mã phòng], LEN(TieuDe) AS [Số ký tự tiêu đề] FROM HoSo WHERE SUBSTRING(MaHS, 5, 2) = 'KD'"
tests:
  - id: 1
    visible: true
    rows:
      HoSo:
        - [ "HS26KD014", "Hợp đồng đại lý" ]
        - [ "HS26IT002", "Mua máy chủ" ]
    expected: [ [ "HS26KD014", "KD", 15 ] ]
  - id: 2
    visible: true
    rows:
      HoSo:
        - [ "HS25KD101", "Báo giá" ]
        - [ "HS25NS007", "Tuyển dụng" ]
        - [ "HS25KD102", "Đề xuất giá" ]
    expected: [ [ "HS25KD101", "KD", 7 ], [ "HS25KD102", "KD", 11 ] ]
  - id: 3
    catches: "SELECT MaHS, SUBSTRING(MaHS, 5, 2), LEN(TieuDe) FROM HoSo WHERE MaHS LIKE '%KD%'"
    rows:
      HoSo:
        - [ "HS26ITKD1", "Mã có đoạn trùng" ]
        - [ "HS26KD200", "Hợp đồng thuê" ]
    expected: [ [ "HS26KD200", "KD", 13 ] ]
  - id: 4
    catches: "SELECT MaHS, SUBSTRING(MaHS, 5, 2), LEN(TieuDe) FROM HoSo WHERE MaHS LIKE 'HS2_KD%'"
    rows:
      HoSo:
        - [ "HS16KD050", "Hồ sơ cũ" ]
        - [ "HS24KD051", "Hồ sơ khác" ]
    expected: [ [ "HS16KD050", "KD", 8 ], [ "HS24KD051", "KD", 10 ] ]
  - id: 5
    catches: "SELECT MaHS, SUBSTRING(MaHS, 5, 2), LEN(RTRIM(LEFT(TieuDe, 20))) FROM HoSo WHERE SUBSTRING(MaHS, 5, 2) = 'KD'"
    rows:
