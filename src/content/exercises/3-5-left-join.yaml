lesson: 3-5-left-join
exercises:
  - id: 3-5-1
    title: IT chưa có hợp đồng
    summary: Tìm nhân viên phòng IT chưa có hợp đồng nào.
    prompt: >-
      Xét mọi hồ sơ hiện mang MaPB bằng IT, không lọc trạng thái hay ngày vào làm.
      Tìm hồ sơ không có bất kỳ dòng HopDong nào theo MaNV.
      Trả MaNV, HoTen, NgayVaoLam theo thứ tự này; ngày vào làm tăng dần.
    columns: [MaNV, HoTen, NgayVaoLam]
    ordered: true
    kind: query
    answer: |
      SELECT nv.MaNV, nv.HoTen, nv.NgayVaoLam
      FROM NhanVien AS nv
      LEFT JOIN HopDong AS hd ON hd.MaNV = nv.MaNV
      WHERE hd.MaHD IS NULL AND nv.MaPB = 'IT'
      ORDER BY nv.NgayVaoLam;
  - id: 3-5-2
    title: Chưa có dòng lương tháng 9
    summary: Tìm nhân viên không có dòng lương kỳ 2026-09.
    prompt: >-
      Xét mọi hồ sơ NhanVien, không lọc trạng thái hay ngày.
      Tìm hồ sơ không có dòng BangLuong trong kỳ 2026-09, dù có thể có lương ở kỳ khác.
      Trả MaNV, HoTen; xếp MaNV tăng dần.
    columns: [MaNV, HoTen]
    ordered: true
    kind: query
    answer: |
      SELECT nv.MaNV, nv.HoTen
      FROM NhanVien AS nv
      LEFT JOIN BangLuong AS bl ON bl.MaNV = nv.MaNV AND bl.KyLuong = '2026-09'
      WHERE bl.MaNV IS NULL
      ORDER BY nv.MaNV;
  - id: 3-5-3
    title: Nhân viên và hợp đồng, kể cả người chưa có
    summary: Liệt kê mọi nhân viên kèm từng hợp đồng của họ.
    prompt: >-
      Lấy mọi hồ sơ NhanVien ở mọi trạng thái, kèm mã từng hợp đồng đang lưu của họ,
      không lọc ngày hay loại hợp đồng. Trả MaNV, HoTen, MaHD theo thứ tự này.
      Hồ sơ chưa có hợp đồng vẫn có mặt, cột MaHD là SQL NULL, không phải chữ NULL.
      Xếp MaNV tăng dần, rồi MaHD tăng dần.
    columns: [MaNV, HoTen, MaHD]
    ordered: true
    kind: query
    answer: |
      SELECT nv.MaNV, nv.HoTen, hd.MaHD
      FROM NhanVien AS nv
      LEFT JOIN HopDong AS hd ON hd.MaNV = nv.MaNV
      ORDER BY nv.MaNV, hd.MaHD;
