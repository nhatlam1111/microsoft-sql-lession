lesson: 1-6-cau-select-dau-tien
exercises:
  - id: 1-6-1
    title: Danh mục chức danh
    summary: Xem đầy đủ danh mục chức danh.
    prompt: >-
      Chị Hạnh cần danh mục chức danh đầy đủ để làm mẫu quyết định bổ nhiệm.
      Lấy mọi chức danh, đủ mọi cột của danh mục. Thứ tự dòng không quan trọng.
    columns: [MaCD, TenCD]
    ordered: false
    kind: query
    answer: |
      SELECT * FROM ChucDanh;
  - id: 1-6-2
    title: Toàn bộ hợp đồng
    summary: Xem mọi hợp đồng, kể cả hợp đồng chưa có ngày kết thúc.
    prompt: >-
      Kế toán hỏi danh sách mọi hợp đồng đang lưu trong bảng hợp đồng, kể cả hợp đồng thử việc, đủ mọi cột.
      Trong kết quả sẽ có ô NgayKetThuc là NULL: trong dữ liệu mẫu, đó là hợp đồng không xác định thời hạn.
      Thứ tự dòng không quan trọng.
    columns: [MaHD, MaNV, LoaiHD, NgayBatDau, NgayKetThuc, LuongCoBan]
    ordered: false
    kind: query
    answer: |
      SELECT * FROM HopDong;
  - id: 1-6-3
    title: Toàn bộ đơn nghỉ phép
    summary: Xem mọi đơn nghỉ phép, có ngày nghỉ và số ngày.
    prompt: >-
      Trước khi chốt công tháng, chị Hạnh muốn xem bảng đơn nghỉ đang lưu những gì: lấy toàn bộ đơn
      (mọi loại nghỉ, mọi trạng thái), đủ mọi cột. Lọc theo tháng hay trạng thái học ở bài 2.2. Thứ tự dòng không quan trọng.
    columns: [MaDon, MaNV, LoaiNghi, TuNgay, DenNgay, SoNgay, TrangThai]
    ordered: false
    kind: query
    answer: |
      SELECT * FROM DonNghiPhep;
