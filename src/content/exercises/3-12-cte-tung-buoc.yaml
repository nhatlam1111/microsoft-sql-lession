lesson: 3-12-cte-tung-buoc
exercises:
  - id: 4-1-1
    title: Tổng ngày đơn đã duyệt bắt đầu tháng 8
    summary: Viết một CTE tính tổng theo loại rồi lọc tổng ở câu ngoài.
    prompt: Dùng một CTE trên DonNghiPhep. Chọn đơn có TrangThai là N'Đã duyệt' và TuNgay trong tháng 8/2026, rồi cộng toàn bộ SoNgay của các đơn theo LoaiNghi. Ở câu ngoài, giữ tổng từ 2 ngày. Trả LoaiNghi, TongNgay. Xếp TongNgay giảm dần, cùng tổng thì xếp LoaiNghi tăng dần.
    columns: [LoaiNghi, TongNgay]
    answer: |-
      WITH TongThang8 AS (
          SELECT LoaiNghi, SUM(SoNgay) AS [TongNgay]
          FROM DonNghiPhep
          WHERE TrangThai = N'Đã duyệt'
              AND TuNgay >= '20260801' AND TuNgay < '20260901'
          GROUP BY LoaiNghi
      )
      SELECT LoaiNghi, TongNgay
      FROM TongThang8
      WHERE TongNgay >= 2
      ORDER BY TongNgay DESC, LoaiNghi ASC;
    ordered: true
    kind: query
  - id: 4-1-2
    title: Phòng có từ tám hồ sơ đang làm
    summary: Nối hai CTE để lọc hồ sơ rồi đếm theo mã phòng.
    prompt: Viết hai CTE. CTE đầu lấy MaPB từ các hồ sơ NhanVien có TrangThai là N'Đang làm'. CTE thứ hai đọc kết quả đó và đếm số hồ sơ theo MaPB hiện lưu. Ở câu ngoài, giữ phòng có ít nhất 8 hồ sơ. Trả MaPB, SoHoSo theo MaPB tăng dần.
    columns: [MaPB, SoHoSo]
    answer: |-
      WITH HoSoDangLam AS (
          SELECT MaPB
          FROM NhanVien
          WHERE TrangThai = N'Đang làm'
      ), HoSoTheoPhong AS (
          SELECT MaPB, COUNT(*) AS [SoHoSo]
          FROM HoSoDangLam
          GROUP BY MaPB
      )
      SELECT MaPB, SoHoSo
      FROM HoSoTheoPhong
      WHERE SoHoSo >= 8
      ORDER BY MaPB ASC;
    ordered: true
    kind: query
  - id: 4-1-3
    title: Đối chiếu số hợp đồng trước khi lọc
    summary: Kiểm hai mã trong CTE đếm rồi lập danh sách các mã có nhiều hợp đồng.
    prompt: Dùng toàn bộ dòng HopDong để đếm số hợp đồng theo MaNV trong CTE đầu. Trước khi lọc ngưỡng, tự kiểm số đếm của NV004 và NV021 bằng cách cho SELECT cuối đọc CTE này và chỉ lấy hai mã đó. Sau đó thêm CTE thứ hai đọc số đếm từ CTE đầu và giữ các mã có ít nhất 2 hợp đồng. Nộp bảng cuối với MaNV, SoHopDong theo MaNV tăng dần. Đề đếm số dòng đang lưu trên mọi loại và ngày hợp đồng.
    columns: [MaNV, SoHopDong]
    answer: |-
      WITH DemHopDong AS (
          SELECT MaNV, COUNT(*) AS [SoHopDong]
          FROM HopDong
          GROUP BY MaNV
      ), NhieuHopDong AS (
          SELECT MaNV, SoHopDong
          FROM DemHopDong
          WHERE SoHopDong >= 2
      )
      SELECT MaNV, SoHopDong
      FROM NhieuHopDong
      ORDER BY MaNV ASC;
    ordered: true
    kind: query
